services:
  api:
    build: ./api
    environment:
      - DJANGO_ALLOWED_HOSTS=web,127.0.0.1,localhost
      - DJANGO_DEBUG=0
    volumes:
      - db_data:/app/data
      - static_data:/app/staticfiles
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - static_data:/srv/static:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  db_data:
  static_data:
